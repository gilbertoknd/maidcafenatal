name: CI/CD Pipeline - Mew Mew Café

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Deploy Automático (CD)
  deploy:
    runs-on: self-hosted
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Executar Deploy Local
        shell: powershell
        run: |
          Write-Host "Iniciando Deploy Local no Mini-PC..."
          cd "C:\Users\pdvme\Documents\GitHub\maidcafenatal"

          Write-Host "Puxando alteracoes da branch ${{ github.ref_name }}..."
          git pull origin ${{ github.ref_name }}

          Write-Host "Reconstruindo containers (produção)..."
          # -f docker-compose.yml explícito: NÃO mesclar o override.yml (dev),
          # senão o deploy roda em modo dev (Vite dev server + tsx watch,
          # NODE_ENV=development). Produção usa target 'runner' (nginx +
          # código compilado) e NODE_ENV=production (necessário p/ o cookie Secure).
          docker compose -f docker-compose.yml up -d --build --no-deps backend frontend

          Write-Host "Limpando imagens antigas..."
          docker image prune -f

          Write-Host "Deploy finalizado com sucesso!"
