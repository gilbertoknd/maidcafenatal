name: CI/CD Pipeline - Mew Mew Café

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Deploy Automático (CD)
  deploy:
    runs-on: self-hosted
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Executar Deploy Local
        shell: powershell
        run: |
          Write-Host "Iniciando Deploy Local no Mini-PC..."
          cd "C:\Users\pdvme\Documents\GitHub\maidcafenatal"

          Write-Host "Puxando alteracoes da branch ${{ github.ref_name }}..."
          git pull origin ${{ github.ref_name }}

          Write-Host "Reconstruindo containers..."
          docker compose up -d --build --no-deps backend frontend

          Write-Host "Limpando imagens antigas..."
          docker image prune -f

          Write-Host "Deploy finalizado com sucesso!"
