services:
  # Banco de Dados Dev Override
  # Publica a porta do Postgres SÓ em desenvolvimento e amarrada ao localhost,
  # para ferramentas locais / backend rodando fora do Docker (localhost:5433).
  # Em produção (docker compose -f docker-compose.yml) a porta não é exposta.
  db:
    ports:
      - "127.0.0.1:${DB_PORT_LOCAL:-5433}:5432"

  # Backend Dev Override
  backend:
    build:
      context: ./backend
      target: builder
    command: pnpm dev
    environment:
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - /app/node_modules # Impede que o volume externo apague o interno
      - ./backend/public/images/:/app/public/images/

  # Frontend Dev Override
  frontend:
    build:
      context: ./frontend
      target: builder
    command: pnpm dev --host
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
