services:
  # Banco de Dados
  db:
    image: postgres:15-alpine
    container_name: maid_postgres
    restart: always
    ports:
      - "${DB_PORT_LOCAL:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - maid_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Produção)
  backend:
    build:
      context: ./backend
      target: runner
    container_name: maid_backend
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    volumes:
      # Apenas uploads persistem
      - ./backend/public/images/:/app/public/images/
    networks:
      - maid_network
    depends_on:
      db:
        condition: service_healthy

  # Frontend (Produção - Nginx)
  frontend:
    build:
      context: ./frontend
      target: runner
    container_name: maid_frontend
    restart: always
    ports:
      # O Nginx/Vite internamente usa a porta 5174
      - "${FRONTEND_PORT:-5174}:5174"
    networks:
      - maid_network
    depends_on:
      - backend

  # Tunnel Cloudflare
  tunnel:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: maid_tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - maid_network
    depends_on:
      - backend
      - frontend

# Rede privada
networks:
  maid_network:
    driver: bridge

# Volumes persistentes
volumes:
  postgres_data:
