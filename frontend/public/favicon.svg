<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- ClipPath circular para cortar a imagem do logo -->
    <clipPath id="circleView">
      <circle cx="256" cy="256" r="256" />
    </clipPath>
  </defs>

  <!-- Fundo rosa claro do tema do café -->
  <circle cx="256" cy="256" r="256" fill="#FFF5F8" />

  <!-- Renderiza o Logo.svg centralizado e cortado.
       O Logo.svg original é retangular 1440x810 (proporção ~1.77).
       Para centralizar o gatinho do meio, redimensionamos o Logo para ter altura=512 e largura=910,
       e deslocamos em x por -199 para centralizar perfeitamente no canvas de 512x512. -->
  <image href="/Logo.svg" x="-199" y="0" width="910" height="512" clip-path="url(#circleView)" />
</svg>
